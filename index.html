
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10091d">
<title>Nova AI — твой ИИ</title>
<style>
:root {
  --bg: #0b0713;
  --panel: #151022;
  --purple: #a855f7;
  --pink: #ec4899;
  --text: #f8f3ff;
  --muted: #a99bbd;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(ellipse at top, #291044, var(--bg) 65%);
  color: var(--text);
  font-family: Inter, Arial, sans-serif;
  min-height: 100vh;
}
button, textarea { font: inherit; }
button { cursor: pointer; color: inherit; }
.app {
  display: grid;
  grid-template-columns: 245px 1fr;
  min-height: 100vh;
}
.sidebar {
  background: #0c0914dd;
  border-right: 1px solid #ffffff12;
  padding: 24px 16px;
}
.logo {
  font-size: 25px;
  font-weight: 800;
  margin-bottom: 28px;
}
.logo span {
  background: linear-gradient(90deg, #c084fc, #f472b6);
  -webkit-background-clip: text;
  color: transparent;
}
.new-chat {
  width: 100%;
  padding: 13px;
  background: #201331;
  border: 1px solid #70409b;
  border-radius: 12px;
  text-align: left;
}
.new-chat:hover { background: #322044; }
.side-info {
  margin-top: 30px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}
main {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
.topbar {
  padding: 18px 25px;
  border-bottom: 1px solid #ffffff10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(15px);
}
.status {
  font-size: 12px;
  color: #c4b5fd;
  background: #241538;
  padding: 8px 12px;
  border-radius: 20px;
}
.clear {
  background: transparent;
  border: 1px solid #ffffff20;
  padding: 8px 12px;
  border-radius: 10px;
}
.chat {
  width: min(820px, 100%);
  margin: auto;
  padding: 35px 22px;
  flex: 1;
}
.welcome {
  text-align: center;
  padding: 35px 0;
  animation: appear .7s ease;
}
.orb {
  width: 75px;
  height: 75px;
  margin: 0 auto 23px;
  display: grid;
  place-items: center;
  border-radius: 24px;
  font-size: 34px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  box-shadow: 0 0 45px #a855f766;
  animation: float 4s ease-in-out infinite;
}
h1 {
  font-size: clamp(30px, 5vw, 45px);
  margin: 0 0 14px;
}
h1 span {
  background: linear-gradient(90deg, #c084fc, #f9a8d4);
  -webkit-background-clip: text;
  color: transparent;
}
.subtitle { color: var(--muted); }
.suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 30px;
  text-align: left;
}
.suggestion {
  padding: 16px;
  background: #171023;
  border: 1px solid #39244d;
  border-radius: 15px;
  transition: .2s;
}
.suggestion:hover {
  border-color: var(--purple);
  transform: translateY(-3px);
  box-shadow: 0 8px 28px #a855f722;
}
.suggestion strong { display: block; margin-bottom: 7px; }
.suggestion small { color: var(--muted); }
.messages {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.message {
  padding: 15px 17px;
  max-width: 90%;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.65;
  border: 1px solid #39244d;
  background: #171023;
  border-radius: 5px 17px 17px 17px;
  animation: appear .25s ease;
}
.message.user {
  align-self: flex-end;
  background: #302043;
  border-color: #7545a0;
  border-radius: 17px 5px 17px 17px;
}
.composer-wrap {
  position: sticky;
  bottom: 0;
  padding: 15px 22px 22px;
  background: linear-gradient(transparent, var(--bg) 25%);
}
.composer {
  max-width: 820px;
  margin: auto;
  background: #171023;
  border: 1px solid #583775;
  border-radius: 18px;
  padding: 10px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  transition: .2s;
}
.composer:focus-within {
  border-color: var(--purple);
  box-shadow: 0 0 25px #a855f722;
}
textarea {
  flex: 1;
  resize: none;
  min-height: 43px;
  max-height: 150px;
  padding: 12px 8px;
  border: 0;
  outline: 0;
  color: white;
  background: transparent;
}
textarea::placeholder { color: #897b9c; }
.send {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  font-size: 23px;
  transition: .2s;
}
.send:hover { transform: scale(1.06); }
.send:disabled { opacity: .5; }
.disclaimer {
  text-align: center;
  font-size: 11px;
  color: #897b9c;
  margin: 10px 0 0;
}
@keyframes appear {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}
@media(max-width:700px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .topbar { padding: 15px; }
  .chat { padding: 18px 14px; }
  .welcome { padding: 35px 0; }
  .suggestions { grid-template-columns: 1fr; gap: 9px; }
  .suggestion { padding: 13px; }
  .composer-wrap { padding: 10px 12px 15px; }
  .message { max-width: 95%; }
}
@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">✦ <span>Nova AI</span></div>
    <button class="new-chat" id="newChat">＋ Новый диалог</button>
    <div class="side-info">
      <p>✧ Твой личный ИИ</p>
      <p>Идеи, учёба, творчество и код.</p>
      <p>Версия 1.0 · Web</p>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <strong>✦ Nova AI</strong>
      <span class="status">● Интерфейс запущен</span>
      <button class="clear" id="clear">Очистить</button>
    </header>

    <section class="chat">
      <div class="welcome" id="welcome">
        <div class="orb">✦</div>
        <h1>Привет, это <span>Nova AI</span></h1>
        <p class="subtitle">О чём поговорим сегодня?</p>

        <div class="suggestions">
          <button class="suggestion" data-prompt="Придумай интересные идеи для проекта">
            <strong>✧ Идеи для проекта</strong>
            <small>Найди вдохновение</small>
          </button>
          <button class="suggestion" data-prompt="Объясни простыми словами, как работает ИИ">
            <strong>◈ Изучить ИИ</strong>
            <small>Разберёмся вместе</small>
          </button>
          <button class="suggestion" data-prompt="Напиши пример простого HTML сайта">
            <strong>⌘ Помощь с кодом</strong>
            <small>Создавай свои проекты</small>
          </button>
          <button class="suggestion" data-prompt="Составь план изучения программирования на неделю">
            <strong>↗ План обучения</strong>
            <small>Двигайся к своей цели</small>
          </button>
        </div>
      </div>

      <div class="messages" id="messages"></div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea id="input" rows="1" maxlength="4000"
          placeholder="Напиши сообщение..." aria-label="Сообщение"></textarea>
        <button class="send" id="send" type="submit" aria-label="Отправить">↑</button>
      </form>
      <p class="disclaimer">Nova AI — экспериментальный проект. Проверяй важную информацию.</p>
    </div>
  </main>
</div>

<script>
const input = document.getElementById("input");
const messagesEl = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const form = document.getElementById("form");
const send = document.getElementById("send");

let messages = [];

function addMessage(text, role) {
  const div = document.createElement("div");
  div.className = "message " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function saveHistory() {
  try {
    localStorage.setItem("nova-ai-history", JSON.stringify(messages.slice(-40)));
  } catch (e) {}
}

function loadHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem("nova-ai-history") || "[]");
    if (!Array.isArray(saved)) return;
    messages = saved.filter(m =>
      m && typeof m.text === "string" &&
      ["user", "assistant"].includes(m.role)
    ).slice(-40);
    messages.forEach(m => addMessage(m.text, m.role));
    welcome.hidden = messages.length > 0;
  } catch (e) {}
}

function makeDemoAnswer(question) {
  const q = question.toLowerCase();

  if (q.includes("привет") || q.includes("здравств")) {
    return "Привет! 💜 Я Nova AI — твой помощник. Пока я работаю в демонстрационном режиме. Подключим настоящую языковую модель следующим шагом!";
  }

  if (q.includes("html") || q.includes("код") || q.includes("программ")) {
    return "Конечно! 💻 Я помогу тебе разобраться с программированием. Сейчас это демонстрационный режим, поэтому я не могу полноценно генерировать и проверять код как настоящая языковая модель. Следующим шагом подключим ИИ.";
  }

  return "Спасибо за сообщение! ✨\n\nИнтерфейс Nova AI уже работает, но настоящий ИИ пока не подключён. Сейчас сайт отвечает демонстрационными сообщениями.\n\nЧтобы получать умные ответы на любые вопросы, следующим шагом подключим языковую модель через безопасный сервер.";
}

async function submitMessage(text) {
  text = (text || input.value).trim();
  if (!text || send.disabled) return;

  welcome.hidden = true;
  addMessage(text, "user");
  messages.push({ text, role: "user" });
  input.value = "";
  input.style.height = "43px";
  send.disabled = true;

  const loading = document.createElement("div");
  loading.className = "message";
  loading.textContent = "Nova AI думает…";
  messagesEl.appendChild(loading);

  await new Promise(resolve => setTimeout(resolve, 500));

  loading.remove();
  const answer = makeDemoAnswer(text);
  addMessage(answer, "assistant");
  messages.push({ text: answer, role: "assistant" });
  saveHistory();
  send.disabled = false;
  input.focus();
}

form.addEventListener("submit", event => {
  event.preventDefault();
  submitMessage();
});

input.addEventListener("input", () => {
  input.style.height = "43px";
  input.style.height = Math.min(input.scrollHeight, 150) + "px";
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

document.querySelectorAll("[data-prompt]").forEach(button => {
  button.addEventListener("click", () => submitMessage(button.dataset.prompt));
});

function clearChat() {
  messages = [];
  messagesEl.replaceChildren();
  welcome.hidden = false;
  try { localStorage.removeItem("nova-ai-history"); } catch (e) {}
  input.focus();
}

document.getElementById("newChat").addEventListener("click", clearChat);
document.getElementById("clear").addEventListener("click", clearChat);

loadHistory();
</script>
</body>
</html>
