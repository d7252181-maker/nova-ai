
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10091d">
<title>Nova AI — твой ИИ</title>

<style>
:root {
  --bg: #0b0713;
  --panel: #151022;
  --purple: #a855f7;
  --pink: #ec4899;
  --text: #f8f3ff;
  --muted: #a99bbd;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: radial-gradient(ellipse at top, #291044, var(--bg) 65%);
  color: var(--text);
  font-family: Inter, Arial, sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
}

button, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  color: inherit;
}

.app {
  display: grid;
  grid-template-columns: 245px 1fr;
  min-height: 100vh;
}

.sidebar {
  background: #0c0914dd;
  border-right: 1px solid #ffffff12;
  padding: 24px 16px;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  margin-bottom: 28px;
}

.logo span {
  background: linear-gradient(90deg, #c084fc, #f472b6);
  -webkit-background-clip: text;
  color: transparent;
}

.new-chat {
  width: 100%;
  padding: 13px;
  background: #201331;
  border: 1px solid #70409b;
  border-radius: 12px;
  text-align: left;
}

.side-info {
  margin-top: 30px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

main {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  min-width: 0;
}

.topbar {
  padding: 18px 25px;
  border-bottom: 1px solid #ffffff10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  backdrop-filter: blur(15px);
}

.status {
  font-size: 12px;
  color: #c4b5fd;
  background: #241538;
  padding: 8px 12px;
  border-radius: 20px;
  white-space: nowrap;
}

.clear {
  background: transparent;
  border: 1px solid #ffffff20;
  padding: 8px 12px;
  border-radius: 10px;
}

.chat {
  width: min(820px, 100%);
  margin: auto;
  padding: 35px 22px;
  flex: 1;
}

.welcome {
  text-align: center;
  padding: 35px 0;
  animation: appear .7s ease;
}

.orb {
  width: 75px;
  height: 75px;
  margin: 0 auto 23px;
  display: grid;
  place-items: center;
  border-radius: 24px;
  font-size: 34px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  box-shadow: 0 0 45px #a855f766;
  animation: float 4s ease-in-out infinite;
}

h1 {
  font-size: clamp(30px, 5vw, 45px);
  margin: 0 0 14px;
}

h1 span {
  background: linear-gradient(90deg, #c084fc, #f9a8d4);
  -webkit-background-clip: text;
  color: transparent;
}

.subtitle {
  color: var(--muted);
}

.suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 30px;
  text-align: left;
}

.suggestion {
  padding: 16px;
  background: #171023;
  border: 1px solid #39244d;
  border-radius: 15px;
  transition: .2s;
}

.suggestion:hover {
  border-color: var(--purple);
  transform: translateY(-3px);
}

.suggestion strong {
  display: block;
  margin-bottom: 7px;
}

.suggestion small {
  color: var(--muted);
}

.messages {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.message {
  padding: 15px 17px;
  max-width: 90%;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.65;
  border: 1px solid #39244d;
  background: #171023;
  border-radius: 5px 17px 17px 17px;
  animation: appear .25s ease;
}

.message.user {
  align-self: flex-end;
  background: #302043;
  border-color: #7545a0;
  border-radius: 17px 5px 17px 17px;
}

.message.error {
  border-color: #b91c1c;
  color: #fecaca;
}

.composer-wrap {
  position: sticky;
  bottom: 0;
  padding: 15px 22px 22px;
  background: linear-gradient(transparent, var(--bg) 25%);
}

.composer {
  max-width: 820px;
  margin: auto;
  background: #171023;
  border: 1px solid #583775;
  border-radius: 18px;
  padding: 10px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.composer:focus-within {
  border-color: var(--purple);
  box-shadow: 0 0 25px #a855f722;
}

textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  font-size: 16px;
  min-height: 43px;
  max-height: 150px;
  padding: 12px 8px;
  border: 0;
  outline: 0;
  color: white;
  background: transparent;
}

textarea::placeholder {
  color: #897b9c;
}

.send {
  width: 46px;
  height: 46px;
  min-width: 46px;
  min-height: 46px;
  flex: 0 0 46px;
  border: 0;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  font-size: 23px;
}

.send:disabled {
  opacity: .5;
  cursor: wait;
}

.disclaimer {
  text-align: center;
  font-size: 11px;
  color: #897b9c;
  margin: 10px 0 0;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

@media(max-width:700px) {
  .app {
    grid-template-columns: 1fr;
  }

  .sidebar {
    display: none;
  }

  .topbar {
    padding: 13px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .status {
    font-size: 11px;
    padding: 7px 9px;
  }

  .clear {
    padding: 8px 10px;
    min-height: 40px;
  }

  .chat {
    padding: 18px 14px;
  }

  .welcome {
    padding: 35px 0;
  }

  .suggestions {
    grid-template-columns: 1fr;
    gap: 9px;
  }

  .suggestion {
    padding: 13px;
  }

  .composer-wrap {
    padding: 10px 12px max(15px, env(safe-area-inset-bottom));
  }

  .composer {
    gap: 6px;
    padding: 8px;
  }

  .message {
    max-width: 95%;
    font-size: 15px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">✦ <span>Nova AI</span></div>

    <button class="new-chat" id="newChat" type="button">
      ＋ Новый диалог
    </button>

    <div class="side-info">
      <p>✧ Твой личный ИИ</p>
      <p>Идеи, учёба, творчество и код.</p>
      <p>Версия 1.2 · Grok API</p>
    </div>
  </aside>

  <main>

    <header class="topbar">
      <strong>✦ Nova AI</strong>
      <span class="status" id="status">● Проверяем сервер…</span>
      <button class="clear" id="clear" type="button">Очистить</button>
    </header>

    <section class="chat">

      <div class="welcome" id="welcome">
        <div class="orb">✦</div>

        <h1>Привет, это <span>Nova AI</span></h1>

        <p class="subtitle">О чём поговорим сегодня?</p>

        <div class="suggestions">

          <button class="suggestion" type="button"
            data-prompt="Придумай интересные идеи для проекта">
            <strong>✧ Идеи для проекта</strong>
            <small>Найди вдохновение</small>
          </button>

          <button class="suggestion" type="button"
            data-prompt="Объясни простыми словами, как работает искусственный интеллект">
            <strong>◈ Изучить ИИ</strong>
            <small>Разберёмся вместе</small>
          </button>

          <button class="suggestion" type="button"
            data-prompt="Напиши пример простого HTML сайта">
            <strong>⌘ Помощь с кодом</strong>
            <small>Создавай свои проекты</small>
          </button>

          <button class="suggestion" type="button"
            data-prompt="Составь план изучения программирования на неделю">
            <strong>↗ План обучения</strong>
            <small>Двигайся к своей цели</small>
          </button>

        </div>
      </div>

      <div class="messages" id="messages" aria-live="polite"></div>

    </section>

    <div class="composer-wrap">

      <form class="composer" id="form">

        <textarea
          id="input"
          rows="1"
          maxlength="8000"
          placeholder="Напиши сообщение..."
          aria-label="Сообщение"
        ></textarea>

        <button class="send" id="send" type="submit" aria-label="Отправить">
          ↑
        </button>

      </form>

      <p class="disclaimer">
        Nova AI — экспериментальный проект. Проверяй важную информацию.
      </p>

    </div>

  </main>
</div>

<script>
const API_BASE_URL = "https://nova-ai-1-1ati.onrender.com";
const API_URL = API_BASE_URL + "/api/chat";

const input = document.getElementById("input");
const messagesEl = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const form = document.getElementById("form");
const send = document.getElementById("send");
const statusEl = document.getElementById("status");

let messages = [];

function addMessage(text, role, isError = false) {
  const div = document.createElement("div");

  div.className =
    "message " + role + (isError ? " error" : "");

  div.textContent = text;

  messagesEl.appendChild(div);

  div.scrollIntoView({
    behavior: "smooth",
    block: "nearest"
  });

  return div;
}

function saveHistory() {
  try {
    localStorage.setItem(
      "nova-ai-history",
      JSON.stringify(messages.slice(-40))
    );
  } catch (error) {
    console.warn("History save error:", error);
  }
}

function loadHistory() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("nova-ai-history") || "[]"
    );

    if (!Array.isArray(saved)) return;

    messages = saved
      .filter(m =>
        m &&
        typeof m.text === "string" &&
        ["user", "assistant"].includes(m.role)
      )
      .slice(-40);

    messages.forEach(m => {
      addMessage(m.text, m.role, Boolean(m.error));
    });

    welcome.hidden = messages.length > 0;

  } catch (error) {
    console.warn("History load error:", error);
  }
}

async function checkServer() {
  try {
    const response = await fetch(API_BASE_URL);

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (data.status !== "online") {
      throw new Error("Server is not online");
    }

    if (data.keyConfigured) {
      statusEl.textContent = "● Grok API настроен";
      statusEl.style.color = "#c4b5fd";
    } else {
      statusEl.textContent = "● Добавь XAI_API_KEY в Render";
      statusEl.style.color = "#fca5a5";
    }

  } catch (error) {
    statusEl.textContent = "● Сервер недоступен";
    statusEl.style.color = "#fca5a5";
    console.warn("Server check:", error);
  }
}

async function submitMessage(text) {
  text = (typeof text === "string" ? text : input.value).trim();

  if (!text || send.disabled) return;

  welcome.hidden = true;

  addMessage(text, "user");

  messages.push({
    text,
    role: "user"
  });

  input.value = "";
  input.style.height = "43px";

  send.disabled = true;

  const loading = addMessage(
    "Nova AI думает…",
    "assistant"
  );

  try {
    const conversation = messages
      .slice(-12)
      .map(item => ({
        role: item.role,
        content: item.text
      }));

    const response = await fetch(API_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        messages: conversation
      })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data.error || "Ошибка сервера: " + response.status
      );
    }

    if (
      typeof data.answer !== "string" ||
      !data.answer.trim()
    ) {
      throw new Error("Grok вернул пустой ответ.");
    }

    loading.remove();

    addMessage(data.answer, "assistant");

    messages.push({
      text: data.answer,
      role: "assistant"
    });

    saveHistory();

  } catch (error) {
    loading.remove();

    let explanation = error.message || String(error);

    if (error instanceof TypeError) {
      explanation =
        "Не удалось связаться с сервером. Проверь интернет, адрес Render и FRONTEND_URL.";
    }

    const errorText =
      "Не удалось получить ответ от Grok.\n" + explanation;

    addMessage(errorText, "assistant", true);

    messages.push({
      text: errorText,
      role: "assistant",
      error: true
    });

    saveHistory();

    console.error("Nova AI error:", error);

  } finally {
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();
  submitMessage(input.value);
});

input.addEventListener("input", () => {
  input.style.height = "43px";

  input.style.height =
    Math.min(input.scrollHeight, 150) + "px";
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

document.querySelectorAll("[data-prompt]").forEach(button => {
  button.addEventListener("click", () => {
    submitMessage(button.dataset.prompt);
  });
});

function clearChat() {
  messages = [];

  messagesEl.replaceChildren();

  welcome.hidden = false;

  try {
    localStorage.removeItem("nova-ai-history");
  } catch (error) {
    console.warn(error);
  }

  input.focus();
}

document.getElementById("newChat")
  .addEventListener("click", clearChat);

document.getElementById("clear")
  .addEventListener("click", clearChat);

loadHistory();
checkServer();
</script>

</body>
</html>
